<!DOCTYPE html>
<html>
<head>
  <title>Admin – DriveLux</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { background: #0a0a0a; color: #fff; margin: 0; font-family: system-ui, sans-serif; }

    .sidebar {
      background: #111;
      min-height: 100vh;
      width: 230px;
      position: fixed;
      top: 0; left: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #1e1e1e;
      z-index: 100;
    }
    .sidebar-brand {
      padding: 22px 24px 18px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
      border-bottom: 1px solid #1e1e1e;
    }
    .sidebar-brand span { color: #ffc107; }
    .sidebar-brand small { display: block; font-size: 11px; font-weight: 400; color: #555; letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }

    .sidebar-nav { flex: 1; padding: 10px 0; }
    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 24px;
      color: #888;
      text-decoration: none;
      font-size: 13.5px;
      transition: all 0.15s;
      border-left: 3px solid transparent;
      position: relative;
    }
    .sidebar-nav a:hover { color: #fff; background: #1a1a1a; }
    .sidebar-nav a.active { color: #ffc107; background: #1a1a1a; border-left-color: #ffc107; }
    .sidebar-nav .divider { border-top: 1px solid #1e1e1e; margin: 8px 0; }
    .sidebar-nav a.danger { color: #dc3545; }
    .sidebar-nav a.danger:hover { background: #1a0a0a; color: #ff6b6b; }

    .badge-dot {
      background: #dc3545;
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      margin-left: auto;
      font-weight: 700;
    }

    .main { margin-left: 230px; padding: 36px 40px; min-height: 100vh; }

    .stat-card {
      background: #161616;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 22px 24px;
      transition: border-color .2s;
    }
    .stat-card:hover { border-color: #ffc107; }
    .stat-card .label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #666; margin-bottom: 6px; }
    .stat-card .value { font-size: 32px; font-weight: 800; color: #ffc107; line-height: 1; }
    .stat-card .icon { font-size: 28px; opacity: .15; }

    table { background: #161616; }
    table thead th { background: #111; color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; border-color: #222 !important; }
    table td { border-color: #222 !important; vertical-align: middle; font-size: 13.5px; }
    table tbody tr:hover { background: #1a1a1a; }

    .page-title { font-size: 22px; font-weight: 800; margin-bottom: 24px; }
    .page-title span { color: #ffc107; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-brand">
      DRIVE<span>LUX</span>
      <small>Admin Panel</small>
    </div>
    <nav class="sidebar-nav">
      <a href="{{ url_for('admin_dashboard') }}" class="{{ 'active' if request.endpoint == 'admin_dashboard' }}">
        📊 Dashboard
      </a>
      <a href="{{ url_for('admin_cars') }}" class="{{ 'active' if request.endpoint in ['admin_cars', 'admin_delete_car', 'admin_toggle_availability'] }}">
        🚗 Manage Cars
      </a>
      <a href="{{ url_for('admin_bookings') }}" class="{{ 'active' if request.endpoint in ['admin_bookings', 'admin_confirm_dropoff'] }}">
        📋 Bookings
      </a>
      <a href="{{ url_for('admin_users') }}" class="{{ 'active' if request.endpoint == 'admin_users' }}">
        👥 Users
      </a>
      <a href="{{ url_for('admin_messages') }}" class="{{ 'active' if 'admin_messages' in request.endpoint or 'admin_reply' in request.endpoint }}">
        💬 Messages
      </a>
      <div class="divider"></div>
      <a href="{{ url_for('home') }}" target="_blank">🌐 View Site</a>
      <a href="{{ url_for('admin_logout') }}" class="danger">🚪 Logout</a>
    </nav>
  </div>

  <div class="main">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
