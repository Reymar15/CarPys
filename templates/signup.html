<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up – DriveLux</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;padding:20px;">

  <div class="auth-box p-4 p-md-5 w-100" style="max-width:420px;">
    <div class="auth-logo mb-1">DRIVE<span class="text-warning">LUX</span></div>
    <h4 class="fw-bold text-center mb-1">Create Account</h4>
    <p class="text-secondary text-center mb-4" style="font-size:14px;">Join DriveLux today</p>

    {% if error %}
    <div class="alert alert-danger d-flex align-items-center gap-2 mb-3">
      <span>⚠️</span> {{ error }}
    </div>
    {% endif %}

    <form method="POST" id="signupForm">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Choose a username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Create a password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-warning w-100 py-2" id="signupBtn">
        <span id="signupText">Create Account</span>
        <span id="signupSpinner" class="dl-spinner ms-2" style="display:none;"></span>
      </button>
    </form>

    <hr style="border-color:var(--border);margin:20px 0;">
    <p class="text-center text-secondary mb-0" style="font-size:13px;">
      Already have an account? <a href="{{ url_for('login') }}" class="text-warning fw-bold">Sign In</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('signupForm').addEventListener('submit', function() {
      document.getElementById('signupBtn').disabled = true;
      document.getElementById('signupText').textContent = 'Creating account...';
      document.getElementById('signupSpinner').style.display = 'inline-block';
    });
  </script>
</body>
</html>
